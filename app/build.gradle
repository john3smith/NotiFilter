plugins { id 'com.android.application' }

android {
    namespace 'com.local.noti_filter'
    compileSdk 36
    defaultConfig {
        applicationId 'com.local.noti_filter'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.0.8'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            debuggable false
            // Preserve the certificate used by existing installed APKs.
            // This is a compatibility release, not a new production key identity.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
