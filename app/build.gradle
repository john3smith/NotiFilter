plugins { id 'com.android.application' }

android {
    namespace 'com.local.noti_filter'
    compileSdk 36
    defaultConfig {
        applicationId project.hasProperty('uiTest') ? 'com.local.noti_filter.uitest' : 'com.local.noti_filter'
        testInstrumentationRunner 'com.local.noti_filter.RuleUiInstrumentation'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.0.14'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            debuggable false
            // Signed separately; never distribute the Android development identity.
            signingConfig null
        }
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }

apply from: rootProject.file("gradle/store-release.gradle")

apply from: rootProject.file("gradle/release-safety.gradle")
